# Demo site configuration. Copy the [extra] section into your own config.toml when using the theme.
base_url = "https://ello-lithuania.github.io/steadfast-zola"
title = "Steadfast: a Zola theme for small service businesses"
description = "Steadfast is a one-page Zola theme for small service businesses, with services, process, pricing, reviews, FAQ and contact sections, plus light and dark modes."
default_language = "en"
compile_sass = false
build_search_index = false

[extra]
brand = "Steadfast"
brand_icon = "wrench"
tagline = "Reliable home repairs for the jobs that keep getting put off. Fair prices, tidy work and a 12-month guarantee."
topbar_text = "Open Monday to Saturday, 8:00 to 18:00"
phone = "+1 000 000 0000"
phone_href = "+10000000000"
email = "hello@example.com"
cta_label = "Get a free quote"
cta_url = "#contact"
og_image = "assets/og.jpg"
credit = true
nav = [
  { name = "Services", url = "#services" },
  { name = "How it works", url = "#process" },
  { name = "Recent work", url = "#work" },
  { name = "Pricing", url = "#pricing" },
  { name = "Reviews", url = "#reviews" },
  { name = "FAQ", url = "#faq" },
  { name = "Contact", url = "#contact" },
]
footer_columns = [
  { title = "Company", links = [
    { name = "Services", url = "#services" },
    { name = "How it works", url = "#process" },
    { name = "Recent work", url = "#work" },
    { name = "Reviews", url = "#reviews" },
  ] },
  { title = "Help", links = [
    { name = "Pricing", url = "#pricing" },
    { name = "FAQ", url = "#faq" },
    { name = "Contact", url = "#contact" },
    { name = "Blog", url = "/blog/" },
    { name = "Privacy", url = "/privacy/" },
  ] },
]
